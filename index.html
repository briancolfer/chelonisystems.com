<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cheloni Systems</title>
<meta name="description" content="Cheloni Systems makes Scute: Work Hours Tracker, an iPhone app for tracking hours against a weekly cap.">
<style>
:root {
  color-scheme: light dark;
  --bg: #ffffff;
  --text: #1d1d1f;
  --muted: #6e6e73;
  --line: #e5e5ea;
  --panel: #f5f5f7;
  --accent: #0a66d8;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000;
    --text: #f5f5f7;
    --muted: #a1a1a6;
    --line: #2c2c2e;
    --panel: #1c1c1e;
    --accent: #4da3ff;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
}
main, footer { max-width: 680px; margin: 0 auto; padding: 0 16px; }
main { padding-top: 40px; padding-bottom: 24px; }
a { color: var(--accent); }
h1 { font-size: 2.1rem; line-height: 1.15; margin: 4px 0 8px; }
h2 { font-size: 1.25rem; margin: 36px 0 8px; }
.eyebrow { margin: 0; color: var(--muted); font-weight: 600; }
.eyebrow a { color: inherit; text-decoration: none; }
.updated { margin: 0 0 24px; color: var(--muted); font-size: 0.9rem; }
.lead { font-size: 1.15rem; }
ul, ol { padding-left: 1.25em; }
li { margin: 6px 0; }
.contact { background: var(--panel); border-radius: 14px; padding: 4px 20px 8px; margin-top: 24px; }
.contact h2 { margin-top: 16px; }
details { border-bottom: 1px solid var(--line); padding: 12px 0; }
details:first-of-type { border-top: 1px solid var(--line); }
summary { cursor: pointer; font-weight: 600; }
details p { margin: 8px 0 4px; }
footer { border-top: 1px solid var(--line); padding-top: 16px; padding-bottom: 40px; color: var(--muted); font-size: 0.9rem; }
footer p { margin: 6px 0 0; }
</style>
</head>
<body>
<main>
  <h1>Cheloni Systems</h1>
  <p class="lead">We make Scute: Work Hours Tracker, an iPhone app that tracks your working hours against each
    contract's weekly cap.</p>
  <ul>
    <li><a href="scute/support.html">Scute Support</a></li>
    <li><a href="scute/privacy.html">Scute Privacy Policy</a></li>
  </ul>
  <p>Contact: <a href="mailto:support@chelonisystems.com">support@chelonisystems.com</a></p>
</main>
<footer>
  <p>© 2026 Cheloni Systems</p>
</footer>
</body>
</html>
